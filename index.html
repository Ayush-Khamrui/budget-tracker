<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Countdown</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
}

.card{
    background:white;
    padding:16px;
    border-radius:12px;
    margin-bottom:16px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

input,select{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:12px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

h1,h2,h3{
    margin-top:0;
}

.expense{
    border-bottom:1px solid #eee;
    padding:8px 0;
}
</style>
</head>
<body>

<div class="container">

    <div class="card">
        <h1>Budget Countdown</h1>

        <label>Monthly Budget (₹)</label>
        <input type="number" id="budgetInput" value="10000">

        <button onclick="saveBudget()">Save Budget</button>
    </div>

    <div class="card">
        <h2>Summary</h2>

        <p><b>Budget:</b> ₹<span id="budget">10000</span></p>
        <p><b>Spent:</b> ₹<span id="spent">0</span></p>
        <p><b>Remaining:</b> ₹<span id="remaining">10000</span></p>
        <p><b>Days Left:</b> <span id="daysLeft">0</span></p>
        <p><b>Safe Daily Spend:</b> ₹<span id="daily">0</span></p>
    </div>

    <div class="card">
        <h2>Add Expense</h2>

        <input type="number" id="amount" placeholder="Amount">

        <select id="category">
            <option>Online Order</option>
            <option>Office Expense</option>
        </select>

        <input type="text" id="description" placeholder="Description">

        <button onclick="addExpense()">Add Expense</button>
    </div>

    <div class="card">
        <h2>Expense History</h2>
        <div id="history"></div>
    </div>

</div>

<script>

const currentMonth = new Date().getMonth();

function getExpenses(){
    return JSON.parse(localStorage.getItem("expenses") || "[]");
}

function saveExpenses(expenses){
    localStorage.setItem("expenses", JSON.stringify(expenses));
}

function getBudget(){
    return Number(localStorage.getItem("budget") || 10000);
}

function saveBudget(){
    const budget = Number(document.getElementById("budgetInput").value);
    localStorage.setItem("budget", budget);
    updateUI();
}

function addExpense(){

    const amount = Number(document.getElementById("amount").value);

    if(!amount){
        alert("Enter amount");
        return;
    }

    const category = document.getElementById("category").value;
    const description = document.getElementById("description").value;

    const expenses = getExpenses();

    expenses.push({
        amount,
        category,
        description,
        date:new Date().toISOString()
    });

    saveExpenses(expenses);

    document.getElementById("amount").value="";
    document.getElementById("description").value="";

    updateUI();
}

function updateUI(){

    document.getElementById("budget").innerText=getBudget();

    const expenses = getExpenses();

    const spent = expenses.reduce((sum,e)=>sum+e.amount,0);

    const remaining = getBudget()-spent;

    document.getElementById("spent").innerText=spent;
    document.getElementById("remaining").innerText=remaining;

    const today = new Date();

    const lastDay = new Date(
        today.getFullYear(),
        today.getMonth()+1,
        0
    );

    const daysLeft = Math.max(
        1,
        Math.ceil(
            (lastDay-today)/(1000*60*60*24)
        )
    );

    document.getElementById("daysLeft").innerText=daysLeft;

    document.getElementById("daily").innerText=
        (remaining/daysLeft).toFixed(0);

    const history = document.getElementById("history");

    history.innerHTML="";

    expenses.slice().reverse().forEach(e=>{

        history.innerHTML += `
        <div class="expense">
            <b>₹${e.amount}</b><br>
            ${e.category}<br>
            ${e.description}
        </div>`;
    });
}

updateUI();

</script>

</body>
</html>
