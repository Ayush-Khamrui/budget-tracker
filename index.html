<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Budget Tracker</title>
<meta name="description" content="Track monthly budgets and spending by Online, Cash, Card, and EMI. Works offline on your device." />

<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0f172a" />
<link rel="icon" type="image/png" href="icons/favicon-64.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Budget" />

<style>
  :root {
    --navy: #0f172a;
    --navy-2: #1e293b;
    --green: #4ade80;
    --green-d: #22c55e;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --muted-2: #94a3b8;
    --blue: #2563eb;
    --blue-bg: #eff6ff;
    --blue-border: #bfdbfe;
    --red: #ef4444;
    --amber: #f59e0b;
    --line: #e2e8f0;
    --field: #f8fafc;
    --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
  }

  /* ---------- Hero ---------- */
  .hero {
    background: linear-gradient(180deg, #0b1224 0%, var(--navy) 60%, #131d33 100%);
    color: #fff;
    padding: calc(18px + env(safe-area-inset-top)) 22px 46px;
    border-radius: 0 0 30px 30px;
  }

  .hero-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .brand svg { width: 24px; height: 24px; color: #fff; }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 20px auto 0;
  }
  .month-label {
    min-width: 150px;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .2px;
    color: #e2e8f0;
  }
  .month-btn,
  .adjust-btn {
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.06);
    color: #cbd5e1;
    cursor: pointer;
    transition: background .15s, color .15s, transform .05s;
  }
  .month-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
  }
  .month-btn:hover,
  .adjust-btn:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
  .month-btn:active,
  .adjust-btn:active { transform: scale(.96); }
  .month-btn svg,
  .adjust-btn svg { width: 17px; height: 17px; }

  .reset-btn {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.05);
    color: #cbd5e1;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .reset-btn:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
  .reset-btn svg { width: 18px; height: 18px; }

  .balance { text-align: center; margin-top: 16px; }
  .balance-label {
    color: #94a3b8;
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .balance-amt {
    font-size: 52px;
    font-weight: 800;
    line-height: 1.05;
    color: var(--green);
    letter-spacing: -1px;
    word-break: break-word;
  }
  .balance-amt.low { color: var(--amber); }
  .balance-amt.over { color: var(--red); }

  .hero-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 26px;
    font-size: 14px;
    color: #94a3b8;
  }
  .total-edit {
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    border-radius: 8px;
    padding: 2px 4px;
    transition: color .15s;
  }
  .total-edit:hover { color: #e2e8f0; }
  .total-edit svg { width: 13px; height: 13px; opacity: .7; }

  .progress {
    margin-top: 10px;
    height: 8px;
    background: rgba(148, 163, 184, 0.25);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--green);
    border-radius: 99px;
    transition: width .35s ease, background .25s ease;
  }
  .progress-bar.low { background: var(--amber); }
  .progress-bar.over { background: var(--red); }

  .budget-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
  }
  .adjust-btn {
    min-height: 38px;
    grid-auto-flow: column;
    justify-content: center;
    gap: 7px;
    border-radius: 11px;
    font-size: 13px;
    font-weight: 700;
  }

  /* ---------- Cards ---------- */
  .card {
    background: var(--card);
    border-radius: 20px;
    box-shadow: var(--shadow);
  }
  .add-card {
    margin: -30px 16px 0;
    padding: 22px 20px;
    position: relative;
    z-index: 2;
  }

  .card-title {
    margin: 0 0 18px;
    font-size: 19px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .plus { color: var(--blue); font-weight: 700; }

  .amount-field {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--field);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    transition: border-color .15s, box-shadow .15s;
  }
  .amount-field:focus-within {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  .amount-field .cur { font-size: 22px; color: var(--muted-2); font-weight: 600; }
  #amountInput {
    flex: 1;
    border: none;
    background: transparent;
    outline: none;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    width: 100%;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  #amountInput::-webkit-outer-spin-button,
  #amountInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #amountInput::placeholder { color: var(--muted-2); }

  .cats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 16px 0;
  }
  .cats-label {
    display: block;
    margin: 16px 2px 0;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .7px;
    text-transform: uppercase;
  }
  .cat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    padding: 16px 10px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .cat svg { width: 24px; height: 24px; }
  .cat:hover { border-color: #cbd5e1; }
  .cat.selected {
    background: var(--blue-bg);
    border-color: var(--blue-border);
    color: var(--blue);
  }

  .deduct {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: var(--muted-2);
    cursor: not-allowed;
    transition: background .15s, transform .05s;
  }
  .deduct.active { background: var(--blue); cursor: pointer; }
  .deduct.active:hover { background: #1d4ed8; }
  .deduct.active:active { transform: scale(.99); }

  /* ---------- Daily pace ---------- */
  .pace-card {
    margin: 18px 16px 0;
    padding: 22px 20px 20px;
  }
  .pace-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
  }
  .pace-title {
    margin: 0;
    font-size: 19px;
    font-weight: 750;
  }
  .pace-subtitle {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.35;
  }
  .pace-status {
    flex: 0 0 auto;
    border-radius: 999px;
    padding: 6px 9px;
    background: #f1f5f9;
    color: #475569;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .25px;
    text-transform: uppercase;
  }
  .pace-status.ahead { background: #dcfce7; color: #15803d; }
  .pace-status.over { background: #fee2e2; color: #b91c1c; }
  .pace-balance { margin-top: 20px; }
  .pace-balance-label { color: var(--muted); font-size: 13px; font-weight: 600; }
  .pace-amount {
    margin-top: 3px;
    color: #16a34a;
    font-size: 31px;
    font-weight: 800;
    letter-spacing: -.5px;
  }
  .pace-amount.over { color: var(--red); }
  .pace-amount.neutral { color: #475569; }
  .pace-metrics {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1px;
    margin: 18px 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--line);
  }
  .pace-metric { min-width: 0; padding: 11px 9px; background: var(--field); }
  .pace-metric-label {
    display: block;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: .35px;
    text-transform: uppercase;
  }
  .pace-metric-value {
    display: block;
    margin-top: 5px;
    overflow: hidden;
    color: var(--text);
    font-size: 13px;
    font-weight: 750;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chart-panel {
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--field);
    padding: 10px 8px 8px;
  }
  .pace-chart { min-height: 190px; }
  .pace-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-empty {
    min-height: 190px;
    display: grid;
    place-items: center;
    padding: 20px;
    color: var(--muted-2);
    text-align: center;
    font-size: 13px;
  }
  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    padding: 8px 8px 2px;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 650;
  }
  .legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .legend-mark { width: 13px; height: 3px; border-radius: 99px; background: var(--green-d); }
  .legend-mark.over { background: var(--red); }
  .legend-mark.projected {
    height: 0;
    border-top: 2px dashed var(--muted-2);
    border-radius: 0;
    background: transparent;
  }
  .pace-caption,
  .pace-next {
    margin: 12px 2px 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
  }
  .pace-next {
    margin-top: 5px;
    color: #475569;
    font-weight: 650;
  }

  /* ---------- History ---------- */
  .history { padding: 30px 20px 0; }
  .history-title {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #334155;
    margin: 0 0 18px;
  }

  .tx-list { display: flex; flex-direction: column; gap: 10px; }

  .tx {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    animation: pop .2s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .tx-icon {
    width: 42px; height: 42px;
    flex: 0 0 42px;
    display: grid; place-items: center;
    border-radius: 12px;
  }
  .tx-icon svg { width: 21px; height: 21px; }
  .tx-icon.online { background: var(--blue-bg); color: var(--blue); }
  .tx-icon.cash { background: #ecfdf5; color: #059669; }
  .tx-icon.card { background: #f5f3ff; color: #7c3aed; }
  .tx-icon.emi { background: #fff7ed; color: #ea580c; }

  .tx-main { flex: 1; min-width: 0; }
  .tx-cat { font-size: 15px; font-weight: 600; color: var(--text); }
  .tx-date { font-size: 12.5px; color: var(--muted-2); margin-top: 2px; }

  .tx-amt { font-size: 15.5px; font-weight: 700; color: var(--red); white-space: nowrap; }

  .tx-del {
    width: 28px; height: 28px;
    flex: 0 0 28px;
    border: none;
    background: transparent;
    color: var(--muted-2);
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    transition: background .15s, color .15s;
  }
  .tx-del:hover { background: #fee2e2; color: var(--red); }

  .empty { text-align: center; padding: 30px 0 10px; color: var(--muted-2); }
  .empty svg { width: 64px; height: 64px; color: #cbd5e1; margin-bottom: 14px; }
  .empty p { margin: 0; font-size: 18px; color: var(--muted-2); }

  /* ---------- Modal ---------- */
  .backdrop {
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
    animation: fade .15s ease;
  }
  .backdrop.show { display: flex; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: #fff;
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
  }
  .modal h3 { margin: 0 0 6px; font-size: 19px; }
  .modal p { margin: 0 0 18px; color: var(--muted); font-size: 14.5px; line-height: 1.4; }
  .modal input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    outline: none;
    margin-bottom: 18px;
  }
  .modal input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--muted);
  }
  .modal-actions button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .modal-actions button.danger { background: var(--red); border-color: var(--red); color: #fff; }
</style>
</head>
<body>

<div class="app">
  <header class="hero">
    <div class="hero-top">
      <div class="brand">
        <!-- wallet -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v1"/><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="13" r="1.2" fill="currentColor" stroke="none"/></svg>
        <span>Budget Tracker</span>
      </div>
      <button class="reset-btn" id="resetBtn" aria-label="Reset all transactions" title="Reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></svg>
      </button>
    </div>

    <nav class="month-nav" aria-label="Choose month">
      <button class="month-btn" id="previousMonth" aria-label="Previous month" title="Previous month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="month-label" id="monthLabel" aria-live="polite"></div>
      <button class="month-btn" id="nextMonth" aria-label="Next month" title="Next month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </nav>

    <div class="balance">
      <div class="balance-label">Remaining this month</div>
      <div class="balance-amt" id="remaining">₹0</div>
    </div>

    <div class="hero-foot">
      <span id="spentText">Spent: ₹0</span>
      <button class="total-edit" id="totalEdit" title="Set this month's budget">
        <span id="totalText">Total: ₹0</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
    </div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <div class="budget-actions" aria-label="Adjust this month's budget">
      <button class="adjust-btn" id="decreaseBudget">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>
        <span>Decrease budget</span>
      </button>
      <button class="adjust-btn" id="increaseBudget">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Increase budget</span>
      </button>
    </div>
  </header>

  <section class="card add-card">
    <h2 class="card-title"><span class="plus">+</span> Add Expense</h2>

    <div class="amount-field">
      <span class="cur">₹</span>
      <input id="amountInput" type="number" inputmode="decimal" min="0" step="any" placeholder="0" />
    </div>

    <span class="cats-label">Payment type</span>
    <div class="cats">
      <button class="cat selected" data-cat="online" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span>Online</span>
      </button>
      <button class="cat" data-cat="cash" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 9h.01M18 15h.01"/></svg>
        <span>Cash</span>
      </button>
      <button class="cat" data-cat="card" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
        <span>Card</span>
      </button>
      <button class="cat" data-cat="emi" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"/></svg>
        <span>EMI</span>
      </button>
    </div>

    <button class="deduct" id="deductBtn" disabled>Deduct</button>
  </section>

  <section class="card pace-card" aria-labelledby="paceTitle">
    <div class="pace-head">
      <div>
        <h2 class="pace-title" id="paceTitle">Daily budget pace</h2>
        <p class="pace-subtitle">Your monthly budget becomes available a little each day.</p>
      </div>
      <span class="pace-status" id="paceStatus">On pace</span>
    </div>

    <div class="pace-balance">
      <div class="pace-balance-label" id="paceBalanceLabel">Available today</div>
      <div class="pace-amount" id="paceAmount">₹0</div>
    </div>

    <div class="pace-metrics">
      <div class="pace-metric">
        <span class="pace-metric-label">Per day</span>
        <span class="pace-metric-value" id="dailyAllowance">₹0</span>
      </div>
      <div class="pace-metric">
        <span class="pace-metric-label">Accrued</span>
        <span class="pace-metric-value" id="accruedBudget">₹0</span>
      </div>
      <div class="pace-metric">
        <span class="pace-metric-label">Spent to date</span>
        <span class="pace-metric-value" id="paceSpent">₹0</span>
      </div>
    </div>

    <div class="chart-panel">
      <div class="pace-chart" id="paceChart" aria-live="polite"></div>
      <div class="chart-legend" aria-hidden="true">
        <span class="legend-item"><span class="legend-mark"></span>Ahead</span>
        <span class="legend-item"><span class="legend-mark over"></span>Over</span>
        <span class="legend-item"><span class="legend-mark projected"></span>No-spend projection</span>
      </div>
    </div>
    <p class="pace-caption" id="paceCaption"></p>
    <p class="pace-next" id="paceNext"></p>
  </section>

  <section class="history">
    <h3 class="history-title" id="historyTitle">Transactions History</h3>
    <div class="tx-list" id="txList"></div>
  </section>
</div>

<!-- Modal -->
<div class="backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modalTitle"></h3>
    <p id="modalBody"></p>
    <div id="modalInputWrap" hidden>
      <input id="modalInput" type="number" inputmode="decimal" min="0" step="any" />
    </div>
    <div class="modal-actions">
      <button id="modalCancel">Cancel</button>
      <button id="modalConfirm" class="primary">OK</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   Local database (IndexedDB) with a localStorage fallback.
   Stores monthly budgets and every expense on the device.
   ========================================================= */
const DEFAULT_BUDGET = 10000;

const DB = (() => {
  const NAME = "budget-tracker";
  const VERSION = 1;
  let dbp = null;

  function open() {
    return new Promise((resolve, reject) => {
      const r = indexedDB.open(NAME, VERSION);
      r.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("expenses"))
          db.createObjectStore("expenses", { keyPath: "id", autoIncrement: true });
        if (!db.objectStoreNames.contains("meta"))
          db.createObjectStore("meta", { keyPath: "key" });
      };
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  }

  function ready() {
    if (!dbp) dbp = open();
    return dbp;
  }

  const reqToPromise = (req) =>
    new Promise((res, rej) => {
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });

  async function store(name, mode) {
    const db = await ready();
    return db.transaction(name, mode).objectStore(name);
  }

  return {
    async getBudget(month) {
      const s = await store("meta", "readonly");
      const row = await reqToPromise(s.get("budget:" + month));
      if (row) return Number(row.value);
      const legacyStore = await store("meta", "readonly");
      const legacy = await reqToPromise(legacyStore.get("budget"));
      return legacy ? Number(legacy.value) : DEFAULT_BUDGET;
    },
    async setBudget(month, value) {
      const s = await store("meta", "readwrite");
      await reqToPromise(s.put({ key: "budget:" + month, value: Number(value) }));
    },
    async allExpenses() {
      const s = await store("expenses", "readonly");
      const rows = await reqToPromise(s.getAll());
      return rows.sort((a, b) => new Date(b.date) - new Date(a.date));
    },
    async addExpense(exp) {
      const s = await store("expenses", "readwrite");
      return reqToPromise(s.add(exp));
    },
    async deleteExpense(id) {
      const s = await store("expenses", "readwrite");
      await reqToPromise(s.delete(id));
    },
    async clearExpenses(month) {
      const rows = await this.allExpenses();
      await Promise.all(rows.filter((e) => expenseMonth(e) === month).map((e) => this.deleteExpense(e.id)));
    },
  };
})();

/* localStorage fallback (private mode / IndexedDB unavailable) with the same API. */
const LSDB = {
  _get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  _set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
  async getBudget(month) {
    const budgets = this._get("bt_budgets", {});
    return Number(budgets[month] ?? this._get("bt_budget", DEFAULT_BUDGET));
  },
  async setBudget(month, value) {
    const budgets = this._get("bt_budgets", {});
    budgets[month] = Number(value);
    this._set("bt_budgets", budgets);
  },
  async allExpenses() {
    return this._get("bt_expenses", []).sort((a, b) => new Date(b.date) - new Date(a.date));
  },
  async addExpense(exp) {
    const list = this._get("bt_expenses", []);
    exp.id = Date.now() + Math.random();
    list.push(exp);
    this._set("bt_expenses", list);
    return exp.id;
  },
  async deleteExpense(id) {
    this._set("bt_expenses", this._get("bt_expenses", []).filter((e) => e.id !== id));
  },
  async clearExpenses(month) {
    this._set("bt_expenses", this._get("bt_expenses", []).filter((e) => expenseMonth(e) !== month));
  },
};

let store = DB; // swapped to LSDB if IndexedDB fails on first use

/* =========================================================
   UI
   ========================================================= */
const inr = new Intl.NumberFormat("en-IN", {
  style: "currency", currency: "INR",
  minimumFractionDigits: 0, maximumFractionDigits: 2,
});
const money = (n) => inr.format(n || 0);
const compactInr = new Intl.NumberFormat("en-IN", {
  style: "currency", currency: "INR", notation: "compact",
  maximumFractionDigits: 1,
});
const compactMoney = (n) => compactInr.format(n || 0);

const els = {
  remaining: document.getElementById("remaining"),
  spentText: document.getElementById("spentText"),
  totalText: document.getElementById("totalText"),
  totalEdit: document.getElementById("totalEdit"),
  progressBar: document.getElementById("progressBar"),
  amount: document.getElementById("amountInput"),
  deduct: document.getElementById("deductBtn"),
  txList: document.getElementById("txList"),
  resetBtn: document.getElementById("resetBtn"),
  previousMonth: document.getElementById("previousMonth"),
  nextMonth: document.getElementById("nextMonth"),
  monthLabel: document.getElementById("monthLabel"),
  historyTitle: document.getElementById("historyTitle"),
  decreaseBudget: document.getElementById("decreaseBudget"),
  increaseBudget: document.getElementById("increaseBudget"),
  paceStatus: document.getElementById("paceStatus"),
  paceBalanceLabel: document.getElementById("paceBalanceLabel"),
  paceAmount: document.getElementById("paceAmount"),
  dailyAllowance: document.getElementById("dailyAllowance"),
  accruedBudget: document.getElementById("accruedBudget"),
  paceSpent: document.getElementById("paceSpent"),
  paceChart: document.getElementById("paceChart"),
  paceCaption: document.getElementById("paceCaption"),
  paceNext: document.getElementById("paceNext"),
};

let selectedCat = "online";
let selectedMonth = monthKey(new Date());

const CAT_LABEL = { online: "Online", office: "Cash", cash: "Cash", card: "Card", emi: "EMI" };
const CAT_ICON = {
  online: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>',
  office: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 9h.01M18 15h.01"/></svg>',
  cash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 9h.01M18 15h.01"/></svg>',
  card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>',
  emi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"/></svg>',
};

function monthKey(date) {
  const d = new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function expenseMonth(expense) {
  return expense.month || monthKey(expense.date);
}

function monthDate(key) {
  const [year, month] = key.split("-").map(Number);
  return new Date(year, month - 1, 1, 12);
}

function shiftMonth(offset) {
  const d = monthDate(selectedMonth);
  d.setMonth(d.getMonth() + offset);
  selectedMonth = monthKey(d);
  render();
}

function entryDateForMonth(key) {
  const now = new Date();
  if (key === monthKey(now)) return now.toISOString();
  const [year, month] = key.split("-").map(Number);
  const lastDay = new Date(year, month, 0).getDate();
  return new Date(year, month - 1, Math.min(now.getDate(), lastDay), now.getHours(), now.getMinutes()).toISOString();
}

function daysInMonth(key) {
  const [year, month] = key.split("-").map(Number);
  return new Date(year, month, 0).getDate();
}

function elapsedDays(key, now = new Date()) {
  const currentMonth = monthKey(now);
  if (key < currentMonth) return daysInMonth(key);
  if (key > currentMonth) return 0;
  return now.getDate();
}

function getPaceData(budget, expenses, key, now = new Date()) {
  const days = daysInMonth(key);
  const elapsed = elapsedDays(key, now);
  const daily = days ? budget / days : 0;
  const spentByDay = Array(days).fill(0);

  expenses.forEach((expense) => {
    const parsedDay = new Date(expense.date).getDate();
    const day = Math.max(1, Math.min(days, parsedDay || 1));
    spentByDay[day - 1] += Number(expense.amount) || 0;
  });

  let spentToDate = 0;
  const actual = [];
  for (let day = 1; day <= elapsed; day += 1) {
    spentToDate += spentByDay[day - 1];
    actual.push({ day, value: daily * day - spentToDate });
  }

  const projected = [];
  if (elapsed > 0 && elapsed < days) {
    projected.push(actual[actual.length - 1]);
    for (let day = elapsed + 1; day <= days; day += 1) {
      projected.push({ day, value: daily * day - spentToDate });
    }
  }

  return {
    days,
    elapsed,
    daily,
    accrued: daily * elapsed,
    spentToDate,
    balance: actual.length ? actual[actual.length - 1].value : 0,
    actual,
    projected,
  };
}

const fmtMonth = (key) =>
  monthDate(key).toLocaleDateString("en-IN", { month: "long", year: "numeric" });

const fmtDate = (iso) =>
  new Date(iso).toLocaleString("en-IN", {
    day: "numeric", month: "short", hour: "2-digit", minute: "2-digit",
  });

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
  );
}

function pacePhrase(value) {
  if (Math.abs(value) < 0.005) return "exactly on pace";
  return value > 0 ? `${money(value)} available` : `${money(Math.abs(value))} over`;
}

function chartLine(x1, y1, x2, y2, color, dash = "") {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="3" stroke-linecap="round" ${dash ? `stroke-dasharray="${dash}"` : ""}/>`;
}

function renderPaceChart(data, monthName) {
  if (!data.actual.length) {
    els.paceChart.innerHTML = `<div class="chart-empty">Daily tracking will begin when ${monthName} starts.</div>`;
    return;
  }

  const width = 620;
  const height = 238;
  const pad = { top: 17, right: 14, bottom: 34, left: 58 };
  const chartWidth = width - pad.left - pad.right;
  const chartHeight = height - pad.top - pad.bottom;
  const allValues = [0, ...data.actual.map((point) => point.value), ...data.projected.map((point) => point.value)];
  let min = Math.min(...allValues);
  let max = Math.max(...allValues);
  const magnitude = Math.max(Math.abs(min), Math.abs(max), data.daily, 1);
  if (min >= 0) min = -magnitude * 0.1;
  if (max <= 0) max = magnitude * 0.1;
  const padding = (max - min) * 0.08;
  min -= padding;
  max += padding;

  const x = (day) => pad.left + ((day - 1) / Math.max(1, data.days - 1)) * chartWidth;
  const y = (value) => pad.top + ((max - value) / (max - min)) * chartHeight;
  const zeroY = y(0);
  const grid = Array.from({ length: 5 }, (_, index) => {
    const value = min + ((max - min) * index) / 4;
    const yPos = y(value);
    return `<line x1="${pad.left}" y1="${yPos}" x2="${width - pad.right}" y2="${yPos}" stroke="#e2e8f0" stroke-width="1"/><text x="${pad.left - 8}" y="${yPos + 4}" fill="#94a3b8" font-size="10" text-anchor="end">${compactMoney(value)}</text>`;
  }).join("");

  const bars = data.actual.map((point) => {
    const color = point.value >= 0 ? "#22c55e" : "#ef4444";
    return `<line x1="${x(point.day)}" y1="${zeroY}" x2="${x(point.day)}" y2="${y(point.value)}" stroke="${color}" stroke-width="5" stroke-linecap="round" opacity=".22"><title>Day ${point.day}: ${pacePhrase(point.value)}</title></line>`;
  }).join("");

  const segments = data.actual.slice(1).map((point, index) => {
    const previous = data.actual[index];
    const x1 = x(previous.day);
    const y1 = y(previous.value);
    const x2 = x(point.day);
    const y2 = y(point.value);
    if ((previous.value >= 0) === (point.value >= 0)) {
      return chartLine(x1, y1, x2, y2, point.value >= 0 ? "#16a34a" : "#ef4444");
    }
    const crossingRatio = Math.abs(previous.value) / (Math.abs(previous.value) + Math.abs(point.value));
    const crossingX = x1 + (x2 - x1) * crossingRatio;
    return chartLine(x1, y1, crossingX, zeroY, previous.value >= 0 ? "#16a34a" : "#ef4444") +
      chartLine(crossingX, zeroY, x2, y2, point.value >= 0 ? "#16a34a" : "#ef4444");
  }).join("");

  const points = data.actual.map((point) => {
    const color = point.value >= 0 ? "#16a34a" : "#ef4444";
    return `<circle cx="${x(point.day)}" cy="${y(point.value)}" r="4" fill="#fff" stroke="${color}" stroke-width="2"><title>Day ${point.day}: ${pacePhrase(point.value)}</title></circle>`;
  }).join("");

  const projection = data.projected.length > 1
    ? `<polyline points="${data.projected.map((point) => `${x(point.day)},${y(point.value)}`).join(" ")}" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/>`
    : "";

  const labelDays = [...new Set([1, 5, 10, 15, 20, 25, data.days].filter((day) => day <= data.days))];
  const xLabels = labelDays.map((day) =>
    `<text x="${x(day)}" y="${height - 9}" fill="#94a3b8" font-size="10" text-anchor="middle">${day}</text>`
  ).join("");

  els.paceChart.innerHTML = `
    <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Daily budget pace for ${monthName}">
      ${grid}
      <line x1="${pad.left}" y1="${zeroY}" x2="${width - pad.right}" y2="${zeroY}" stroke="#64748b" stroke-width="1.5"/>
      <text x="${width - pad.right}" y="${zeroY - 6}" fill="#64748b" font-size="10" text-anchor="end">ON PACE</text>
      ${bars}${projection}${segments}${points}${xLabels}
    </svg>`;
}

function renderPace(budget, expenses, monthName) {
  const pace = getPaceData(budget, expenses, selectedMonth);
  const isOver = pace.balance < -0.005;
  const isAhead = pace.balance > 0.005;

  els.dailyAllowance.textContent = money(pace.daily);
  els.accruedBudget.textContent = money(pace.accrued);
  els.paceSpent.textContent = money(pace.spentToDate);
  els.paceStatus.textContent = pace.elapsed === 0 ? "Not started" : isOver ? "Over pace" : isAhead ? "Healthy" : "On pace";
  els.paceStatus.className = "pace-status" + (pace.elapsed === 0 ? "" : isOver ? " over" : isAhead ? " ahead" : "");
  els.paceBalanceLabel.textContent = pace.elapsed === 0 ? "Available so far" : isOver ? "Over today's allowance" : isAhead ? "Available today" : "Current position";
  els.paceAmount.textContent = money(isOver ? Math.abs(pace.balance) : pace.balance);
  els.paceAmount.className = "pace-amount" + (isOver ? " over" : pace.elapsed === 0 || !isAhead ? " neutral" : "");

  if (pace.elapsed === 0) {
    els.paceCaption.textContent = `${monthName} has ${pace.days} days. ${money(pace.daily)} will become available at the start of each day.`;
    els.paceNext.textContent = "";
  } else {
    const completedMonth = selectedMonth < monthKey(new Date());
    els.paceCaption.textContent = `${completedMonth ? "Final day" : `Day ${pace.elapsed}`} of ${pace.days}. ${money(pace.daily)} is added at the start of each day.`;
    if (!completedMonth && pace.elapsed < pace.days) {
      els.paceNext.textContent = `With no more spending today, tomorrow starts ${pacePhrase(pace.balance + pace.daily)}.`;
    } else {
      els.paceNext.textContent = "";
    }
  }

  renderPaceChart(pace, monthName);
}

async function render() {
  const [budget, allExpenses] = await Promise.all([store.getBudget(selectedMonth), store.allExpenses()]);
  const expenses = allExpenses.filter((e) => expenseMonth(e) === selectedMonth);
  const spent = expenses.reduce((sum, e) => sum + Number(e.amount), 0);
  const remaining = budget - spent;

  const monthName = fmtMonth(selectedMonth);
  els.monthLabel.textContent = monthName;
  els.historyTitle.textContent = `Transactions · ${monthName}`;
  els.remaining.textContent = money(remaining);
  els.spentText.textContent = "Spent: " + money(spent);
  els.totalText.textContent = "Total: " + money(budget);

  const pct = budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
  els.progressBar.style.width = pct + "%";

  const ratio = budget > 0 ? spent / budget : 0;
  const level = remaining < 0 ? "over" : ratio >= 0.8 ? "low" : "";
  els.remaining.className = "balance-amt" + (level ? " " + level : "");
  els.progressBar.className = "progress-bar" + (level ? " " + level : "");
  renderPace(budget, expenses, monthName);

  if (!expenses.length) {
    els.txList.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1.5L8 22l2-1.5L12 22l2-1.5L16 22l2-1.5L20 22V2l-2 1.5L16 2l-2 1.5L12 2l-2 1.5L8 2 6 3.5 4 2z"/><path d="M12 7v2"/><path d="M9.5 9.5c0-1 .8-1.5 2.5-1.5s2.5.5 2.5 1.5-1 1.4-2.5 1.5-2.5.5-2.5 1.5.8 1.5 2.5 1.5 2.5-.5 2.5-1.5"/><path d="M12 13v2"/></svg>
        <p>No expenses logged yet.</p>
      </div>`;
    return;
  }

  els.txList.innerHTML = expenses
    .map(
      (e) => `
      <div class="tx">
        <div class="tx-icon ${e.category === "office" ? "cash" : e.category}">${CAT_ICON[e.category] || CAT_ICON.online}</div>
        <div class="tx-main">
          <div class="tx-cat">${CAT_LABEL[e.category] || escapeHtml(e.category)}</div>
          <div class="tx-date">${fmtDate(e.date)}</div>
        </div>
        <div class="tx-amt">-${money(e.amount)}</div>
        <button class="tx-del" data-id="${e.id}" aria-label="Delete transaction">✕</button>
      </div>`
    )
    .join("");
}

/* ---- Add expense ---- */
function syncDeductState() {
  const v = parseFloat(els.amount.value);
  const ok = v > 0;
  els.deduct.disabled = !ok;
  els.deduct.classList.toggle("active", ok);
}

els.amount.addEventListener("input", syncDeductState);

document.querySelectorAll(".cat").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".cat").forEach((b) => {
      b.classList.remove("selected");
      b.setAttribute("aria-pressed", "false");
    });
    btn.classList.add("selected");
    btn.setAttribute("aria-pressed", "true");
    selectedCat = btn.dataset.cat;
  });
});

async function deduct() {
  const amount = parseFloat(els.amount.value);
  if (!(amount > 0)) return;
  await store.addExpense({
    amount,
    category: selectedCat,
    month: selectedMonth,
    date: entryDateForMonth(selectedMonth),
  });
  els.amount.value = "";
  syncDeductState();
  await render();
}

els.deduct.addEventListener("click", deduct);
els.amount.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !els.deduct.disabled) deduct();
});

els.previousMonth.addEventListener("click", () => shiftMonth(-1));
els.nextMonth.addEventListener("click", () => shiftMonth(1));

/* ---- Delete a single transaction ---- */
els.txList.addEventListener("click", async (e) => {
  const btn = e.target.closest(".tx-del");
  if (!btn) return;
  const id = btn.dataset.id;
  // IndexedDB keys are numbers; LS fallback keys may be numeric too.
  await store.deleteExpense(isNaN(Number(id)) ? id : Number(id));
  await render();
});

/* =========================================================
   Modal helper
   ========================================================= */
const modal = {
  backdrop: document.getElementById("backdrop"),
  title: document.getElementById("modalTitle"),
  body: document.getElementById("modalBody"),
  inputWrap: document.getElementById("modalInputWrap"),
  input: document.getElementById("modalInput"),
  cancel: document.getElementById("modalCancel"),
  confirm: document.getElementById("modalConfirm"),
};

let onConfirm = null;

function openModal({ title, body, withInput, inputValue, confirmText, danger }) {
  modal.title.textContent = title;
  modal.body.textContent = body || "";
  modal.body.hidden = !body;
  modal.inputWrap.hidden = !withInput;
  if (withInput) {
    modal.input.min = "0";
    modal.input.max = "";
    modal.input.placeholder = "";
    modal.input.setCustomValidity("");
    modal.input.value = inputValue ?? "";
    setTimeout(() => { modal.input.focus(); modal.input.select(); }, 50);
  }
  modal.confirm.textContent = confirmText || "OK";
  modal.confirm.className = danger ? "danger" : "primary";
  modal.backdrop.classList.add("show");
}

function closeModal() {
  modal.backdrop.classList.remove("show");
  onConfirm = null;
}

modal.cancel.addEventListener("click", closeModal);
modal.backdrop.addEventListener("click", (e) => {
  if (e.target === modal.backdrop) closeModal();
});
modal.confirm.addEventListener("click", () => {
  if (onConfirm) onConfirm();
});
modal.input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && onConfirm) onConfirm();
});
modal.input.addEventListener("input", () => modal.input.setCustomValidity(""));

/* ---- Set budget ---- */
els.totalEdit.addEventListener("click", async () => {
  const current = await store.getBudget(selectedMonth);
  openModal({
    title: `Set ${fmtMonth(selectedMonth)} budget`,
    body: "Enter the total budget for this month.",
    withInput: true,
    inputValue: current,
    confirmText: "Save",
  });
  onConfirm = async () => {
    const v = parseFloat(modal.input.value);
    if (!(v >= 0)) return;
    await store.setBudget(selectedMonth, v);
    closeModal();
    await render();
  };
});

async function openBudgetAdjustment(direction) {
  const current = await store.getBudget(selectedMonth);
  const increasing = direction === "increase";
  openModal({
    title: `${increasing ? "Increase" : "Decrease"} budget`,
    body: `Enter how much to ${direction} the ${fmtMonth(selectedMonth)} budget by.`,
    withInput: true,
    inputValue: "",
    confirmText: increasing ? "Increase" : "Decrease",
  });
  modal.input.min = "0.01";
  modal.input.max = increasing ? "" : String(current);
  modal.input.placeholder = "Amount";
  onConfirm = async () => {
    const amount = parseFloat(modal.input.value);
    if (!(amount > 0) || (!increasing && amount > current)) {
      modal.input.setCustomValidity(!increasing && amount > current ? "The decrease cannot exceed the current budget." : "Enter an amount greater than zero.");
      modal.input.reportValidity();
      return;
    }
    await store.setBudget(selectedMonth, increasing ? current + amount : current - amount);
    closeModal();
    await render();
  };
}

els.increaseBudget.addEventListener("click", () => openBudgetAdjustment("increase"));
els.decreaseBudget.addEventListener("click", () => openBudgetAdjustment("decrease"));

/* ---- Reset ---- */
els.resetBtn.addEventListener("click", () => {
  openModal({
    title: `Reset ${fmtMonth(selectedMonth)}?`,
    body: "This permanently deletes every transaction in this month. Its budget is kept.",
    confirmText: "Reset",
    danger: true,
  });
  onConfirm = async () => {
    await store.clearExpenses(selectedMonth);
    closeModal();
    await render();
  };
});

/* =========================================================
   Boot
   ========================================================= */
(async function init() {
  try {
    await store.getBudget(selectedMonth); // touch IndexedDB to confirm it works
  } catch (err) {
    console.warn("IndexedDB unavailable, using localStorage fallback.", err);
    store = LSDB;
  }
  await render();
})();

function scheduleDailyRefresh() {
  const now = new Date();
  const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1);
  setTimeout(async () => {
    await render();
    scheduleDailyRefresh();
  }, nextMidnight - now);
}

scheduleDailyRefresh();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") render();
});

/* Register the service worker for offline / installable PWA. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((e) => console.warn("SW registration failed", e));
  });
}
</script>
